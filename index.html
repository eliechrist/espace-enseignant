function rg(s){const[a,b]=s.split("-"),f=x=>{const m=+x.slice(0,2),dd=+x.slice(2);return new Date(m>=8?2026:2027,m-1,dd)};return[f(a),f(b)]}

 for(const row of P.r)for(let j=1;j<row.length;j++){if(!row[j])continue;const[a,b]=rg(row[j]);b.setHours(23,59,59,0);if(t>=a&&t<=b)return{row:row[0],col:P.c[j-1],i:P.r.indexOf(row),j}}return null}
